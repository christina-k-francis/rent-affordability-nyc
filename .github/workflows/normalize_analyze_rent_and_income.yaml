name: Update and Normalize Rent/Income Tables, and Calculate Derived YoY Change Percentage Tables in BQ 

on:
  push:
    branches:
      - main
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  Post-ETL-SQL-Queries:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
            
      - name: Authenticate Google Cloud Connection
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: rent-affordability
          install_components: bq

      - name: Verify authentication
        run: gcloud auth list

      - name: Check for missing reference/primary tables
        id: check_refs
        run: |
          set +e

          PROJECT="rent-affordability"
          DATASET="nyc_analysis"

          TABLES=(
            ref_boroughs
            ref_neighborhoods
            ref_districts
            ref_district_neighborhoods
          )

          MISSING_TABLES=()

          for TABLE in "${TABLES[@]}"; do
            bq show --project_id="${PROJECT}" "${PROJECT}:${DATASET}.${TABLE}" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "${TABLE} is missing"
              MISSING_TABLES+=("${TABLE}")
            else
              echo "${TABLE} exists"
            fi
          done

          if [ ${#MISSING_TABLES[@]} -eq 0 ]; then
            echo "none_missing=true" >> $GITHUB_OUTPUT
          else
            echo "none_missing=false" >> $GITHUB_OUTPUT
            echo "missing_tables=${MISSING_TABLES[*]}" >> $GITHUB_OUTPUT
          fi
            
      - name: Create reference tables with foreign key connections that DNE
        if: steps.check_refs.outputs.none_missing == 'false'
        env:
          MISSING_TABLES: ${{ steps.check_refs.outputs.missing_tables }}
        run: |
          set -e
          
          PROJECT="rent-affordability"

          for TABLE in ${MISSING_TABLES}; do
            SQL_FILE="BigQuery/SQL/primary_reference_tables/${TABLE}.sql"

            if [ ! -f "${SQL_FILE}" ]; then
              echo "SQL file not found at ${SQL_FILE}"
              exit 1
            fi

            bq query \
              --project_id=${PROJECT} \
              --use_legacy_sql=false \
              < "${SQL_FILE}" 
          done

      - name: Execute rent normalization script
        run: |
            set -e
            bq query \
                --project_id=rent-affordability \
                --use_legacy_sql=false \
                < BigQuery/SQL/normalize_median_rent.sql
            bq query --quiet

      - name: Execute rent YoY analysis script
        run: |
            set -e
            bq query \
                --project_id=rent-affordability \
                --use_legacy_sql=false \
                < BigQuery/SQL/calc_yoy_median_rent.sql
            bq query --quiet

      - name: Execute income normalization script
        run: |
            set -e
            bq query \
                --project_id=rent-affordability \
                --use_legacy_sql=false \
                < BigQuery/SQL/normalize_median_income.sql
            bq query --quiet

      - name: Execute income YoY analysis script
        run: |
            set -e
            bq query \
                --project_id=rent-affordability \
                --use_legacy_sql=false \
                < BigQuery/SQL/calc_yoy_median_income.sql
            bq query --quiet